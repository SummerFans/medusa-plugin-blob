name: ci

on:
  push:
    branches:
      - main
      - preview

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4

      - name: Compile
        run: yarn && yarn build

  preview:
    needs: [compile]
    if: github.event_name == 'push' && contains(github.ref, 'refs/heads/preview')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4

      - name: Compile
        run: yarn && yarn build

      - name: Publish to npm
        run:
          npm config set //registry.npmjs.org/:_authToken ${NPM_TOKEN}
          npm publish --tag preview --access public
      
  publish:
    needs: [compile]
    if: github.event_name == 'push' && contains(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4

      - name: Compile
        run: yarn && yarn build
  
      - name: Publish to npm
        run:
          npm config set //registry.npmjs.org/:_authToken ${NPM_TOKEN}
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
